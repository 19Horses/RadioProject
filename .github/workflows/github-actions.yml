name: Actions

on:
  push:
  # Fired by the Sanity webhook when content is published, so newly published
  # mixes/radiograms get their share (Open Graph) metadata prerendered.
  repository_dispatch:
    types: [sanity-publish]
  # Manual "Run workflow" button, for forcing a rebuild.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: build and deploy
    # Only gate pushes to main; dispatch events always run on the default branch.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install and Build
        run: |
          yarn install
          yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
